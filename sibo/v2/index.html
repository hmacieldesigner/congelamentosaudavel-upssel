<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<title>Teste de SIBO — O Protocolo SIBO</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F2F7;
    --card:#FFFFFF;
    --label:#1C1C1E;
    --label2:#6C6C70;
    --label3:#AEAEB2;
    --sep:rgba(60,60,67,.12);
    --green:#2FAE63;
    --green-d:#1E8F4B;
    --green-soft:#EAF8EF;
    --orange:#FF9500;
    --red:#FF3B30;
    --blue:#0A84FF;
    --purple:#AF52DE;
    --teal:#30B0C7;
    --yellow:#FFCC00;
    --r:20px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,sans-serif;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    font-family:var(--font);
    color:var(--label);
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    line-height:1.4;
    letter-spacing:-0.011em;
  }
  button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;touch-action:manipulation;}
  h1,h2,h3,p{margin:0;}
  #app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--bg);}
  .screen{animation:enter .5s var(--ease) backwards;min-height:100vh;min-height:100dvh;}
  @keyframes enter{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:none;}}
  @keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
  .rise{animation:rise .7s var(--ease) both;}
  .d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}.d5{animation-delay:.4s}

  /* ---------- ícones ---------- */
  svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .tile{
    width:44px;height:44px;border-radius:12px;flex:none;
    display:flex;align-items:center;justify-content:center;color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 4px 10px -4px rgba(0,0,0,.25);
  }
  .tile.lg{width:76px;height:76px;border-radius:22px;}
  .tile.lg svg.i{width:38px;height:38px;}
  .t-green{background:linear-gradient(145deg,#5AD58B,#1E9A55);}
  .t-orange{background:linear-gradient(145deg,#FFB340,#FF8A00);}
  .t-red{background:linear-gradient(145deg,#FF6B60,#E02D22);}
  .t-blue{background:linear-gradient(145deg,#52A9FF,#0A6FE0);}
  .t-purple{background:linear-gradient(145deg,#C98BF0,#9A3FD0);}
  .t-teal{background:linear-gradient(145deg,#5FD3E6,#1E94AB);}
  .t-yellow{background:linear-gradient(145deg,#FFDE5C,#F2B300);}

  /* ---------- botões ---------- */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;height:56px;border-radius:18px;
    font-size:17px;font-weight:600;letter-spacing:-0.02em;
    transition:transform .18s var(--ease), opacity .2s, box-shadow .2s;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{
    color:#fff;
    background:linear-gradient(180deg,#3BC171 0%,#23A257 100%);
    box-shadow:0 10px 24px -10px rgba(35,162,87,.7), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .btn[disabled]{opacity:.35;pointer-events:none;box-shadow:none;}
  .btn-link{height:44px;color:var(--label2);font-size:15px;font-weight:500;width:100%;}

  /* ---------- barra superior ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:14px;
    padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
    background:rgba(242,242,247,.82);
    -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  }
  .back{
    width:34px;height:34px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    background:rgba(120,120,128,.12);color:var(--label);
    transition:transform .15s;
  }
  .back:active{transform:scale(.9);}
  .back svg.i{width:18px;height:18px;stroke-width:2.6;}
  .progress{flex:1;height:6px;border-radius:6px;background:rgba(120,120,128,.16);overflow:hidden;}
  .progress i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#5AD58B,#2FAE63);transition:width .6s var(--ease);}
  .step-count{font-size:13px;font-weight:600;color:var(--label2);min-width:38px;text-align:right;font-variant-numeric:tabular-nums;}

  /* ---------- splash ---------- */
  .splash{
    padding:calc(env(safe-area-inset-top) + 30px) 22px calc(env(safe-area-inset-bottom) + 24px);
    display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
    background:
      radial-gradient(120% 60% at 50% -10%, #CDEFD9 0%, rgba(205,239,217,0) 60%),
      var(--bg);
    position:relative;overflow:hidden;
  }
  .orb-wrap{position:relative;height:210px;display:flex;align-items:center;justify-content:center;margin-top:8px;}
  .orb{
    width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #A7EBC2 0%, #3DBE72 45%, #167A41 100%);
    box-shadow:0 30px 60px -20px rgba(30,143,75,.6), inset 0 -12px 30px rgba(0,60,30,.25), inset 0 10px 24px rgba(255,255,255,.35);
    animation:float 6s ease-in-out infinite;
    position:relative;
  }
  .orb::after{
    content:"";position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 70% 80%, rgba(255,255,255,.22), transparent 45%);
  }
  .orb-ring{
    position:absolute;width:210px;height:210px;border-radius:50%;
    border:1.5px solid rgba(47,174,99,.28);animation:pulse 3.2s ease-out infinite;
  }
  .orb-ring.r2{animation-delay:1.6s;}
  @keyframes float{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-10px) scale(1.02);}}
  @keyframes pulse{0%{transform:scale(.7);opacity:.9;}100%{transform:scale(1.25);opacity:0;}}
  .orb-icon{position:absolute;z-index:2;color:#fff;}
  .orb-icon svg.i{width:60px;height:60px;stroke-width:1.8;}
  .splash h1{font-size:38px;line-height:1.05;font-weight:800;letter-spacing:-0.035em;text-align:center;margin-top:18px;}
  .splash h1 span{background:linear-gradient(90deg,#1E9A55,#30B0C7);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .splash .sub{text-align:center;color:var(--label2);font-size:17px;margin-top:12px;padding:0 6px;}
  .inset{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.02);}
  .row{display:flex;align-items:center;gap:14px;padding:14px 16px;position:relative;}
  .row + .row::before{content:"";position:absolute;top:0;left:74px;right:0;height:1px;background:var(--sep);}
  .row b{display:block;font-size:16px;font-weight:600;letter-spacing:-0.02em;}
  .row span.s{display:block;font-size:14px;color:var(--label2);margin-top:1px;}
  .splash .inset{margin-top:26px;}
  .splash .cta{margin-top:auto;padding-top:24px;}
  .fine{font-size:12.5px;color:var(--label3);text-align:center;margin-top:12px;}

  /* ---------- pergunta ---------- */
  .q{padding:8px 20px calc(env(safe-area-inset-bottom) + 150px);}
  .q-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;margin-top:10px;}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green-d);}
  .q h2{font-size:28px;line-height:1.12;font-weight:800;letter-spacing:-0.03em;}
  .q .hint{font-size:15px;color:var(--label2);margin-top:8px;}
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:24px;}
  .opt{
    width:100%;text-align:left;
    display:flex;align-items:center;gap:14px;
    background:var(--card);border-radius:16px;padding:16px 16px 16px 18px;
    font-size:16.5px;font-weight:500;letter-spacing:-0.02em;line-height:1.3;
    border:2px solid transparent;
    transition:transform .18s var(--ease), border-color .2s, background .2s, box-shadow .2s;
    animation:rise .55s var(--ease) both;
  }
  .opt:active{transform:scale(.98);}
  .opt .t{flex:1;}
  .chk{
    width:26px;height:26px;border-radius:50%;flex:none;
    border:2px solid #D1D1D6;display:flex;align-items:center;justify-content:center;
    transition:all .25s var(--ease);color:transparent;
  }
  .chk.sq{border-radius:8px;}
  .chk svg.i{width:15px;height:15px;stroke-width:3.4;transform:scale(.4);transition:transform .3s cubic-bezier(.3,1.6,.5,1);}
  .opt.sel{border-color:var(--green);background:var(--green-soft);box-shadow:0 8px 20px -12px rgba(47,174,99,.6);}
  .opt.sel .chk{background:var(--green);border-color:var(--green);color:#fff;}
  .opt.sel .chk svg.i{transform:scale(1);}
  .multi-tag{font-size:13px;color:var(--label2);margin-top:14px;text-align:center;}

  .bottom-bar{
    position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:460px;z-index:30;
    padding:14px 20px calc(env(safe-area-inset-bottom) + 16px);
    background:linear-gradient(180deg,rgba(242,242,247,0) 0%,rgba(242,242,247,.92) 38%);
  }

  /* ---------- captura ---------- */
  .cap{padding:12px 20px 40px;}
  .cap h2{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-0.03em;margin-top:16px;}
  .cap .hint{font-size:16px;color:var(--label2);margin-top:10px;}
  .form{margin-top:26px;}
  .field{display:flex;flex-direction:column;padding:12px 16px;position:relative;}
  .field + .field::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep);}
  .field label{font-size:12.5px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.04em;}
  .field input{
    border:none;outline:none;background:transparent;font-family:inherit;
    font-size:18px;padding:6px 0 2px;color:var(--label);width:100%;letter-spacing:-0.02em;
  }
  .field input::placeholder{color:var(--label3);}
  .field.err label{color:var(--red);}
  .lock-note{display:flex;flex-direction:column;text-align:center;gap:6px;align-items:center;justify-content:center;color:var(--label2);font-size:13px;margin-top:16px;}
  .lock-note svg.i{width:15px;height:15px;}

  /* ---------- analisando ---------- */
  .ana{padding:calc(env(safe-area-inset-top) + 90px) 28px 40px;text-align:center;}
  .ring-spin{width:84px;height:84px;margin:0 auto 26px;}
  .ring-spin circle{fill:none;stroke-width:7;}
  .ring-spin .bg{stroke:rgba(120,120,128,.16);}
  .ring-spin .fg{stroke:var(--green);stroke-linecap:round;stroke-dasharray:60 200;transform-origin:center;animation:spin 1.1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .ana h2{font-size:26px;font-weight:800;letter-spacing:-0.03em;}
  .checks{margin:34px auto 0;max-width:300px;display:flex;flex-direction:column;gap:16px;text-align:left;}
  .ck{display:flex;gap:12px;align-items:center;font-size:16px;color:var(--label3);transition:color .4s;}
  .ck .dot{
    width:24px;height:24px;border-radius:50%;border:2px solid #D1D1D6;flex:none;
    display:flex;align-items:center;justify-content:center;transition:all .35s var(--ease);color:transparent;
  }
  .ck .dot svg.i{width:13px;height:13px;stroke-width:3.4;}
  .ck.on{color:var(--label);}
  .ck.done{color:var(--label);}
  .ck.done .dot{background:var(--green);border-color:var(--green);color:#fff;}

  /* ---------- resultado ---------- */
  .res{padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 130px);}
  .res .eyebrow{text-align:center;display:block;}
  .score-card{background:var(--card);border-radius:28px;padding:26px 20px 24px;margin-top:14px;text-align:center;box-shadow:0 20px 40px -26px rgba(0,0,0,.25);}
  .ring{position:relative;width:176px;height:176px;margin:0 auto;}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring circle{fill:none;stroke-width:13;stroke-linecap:round;}
  .ring .bg{stroke:rgba(120,120,128,.14);}
  .ring .fg{transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1);}
  .ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring .num b{font-size:50px;font-weight:800;letter-spacing:-0.04em;line-height:1;font-variant-numeric:tabular-nums;}
  .ring .num span{font-size:12.5px;color:var(--label2);font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:.05em;}
  .lvl{font-size:26px;font-weight:800;letter-spacing:-0.03em;margin-top:18px;}
  .lvl-copy{color:var(--label2);font-size:15.5px;margin-top:8px;}
  .sec-title{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--label2);margin:26px 8px 8px;}
  .cat{padding:14px 16px;position:relative;}
  .cat + .cat::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep);}
  .cat-top{display:flex;align-items:center;gap:12px;}
  .cat-top .tile{width:34px;height:34px;border-radius:9px;}
  .cat-top .tile svg.i{width:18px;height:18px;}
  .cat-top b{font-size:16px;font-weight:600;flex:1;letter-spacing:-0.02em;}
  .cat-top em{font-style:normal;font-size:14px;font-weight:600;color:var(--label2);}
  .bar{height:8px;border-radius:8px;background:rgba(120,120,128,.14);margin-top:10px;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;border-radius:8px;transition:width 1.2s var(--ease) .3s;}
  .teaser{
    margin-top:22px;border-radius:22px;padding:20px;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(145deg,#1B3A2D,#2F6B50);
  }
  .teaser::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(120,230,170,.35),transparent 70%);}
  .teaser .tg{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#9FE8BC;}
  .teaser .tg svg.i{width:14px;height:14px;}
  .teaser p{margin-top:10px;font-size:16px;line-height:1.4;color:#E8F6EE;position:relative;}
  .blur{height:12px;border-radius:6px;margin-top:10px;background:rgba(255,255,255,.14);position:relative;overflow:hidden;}
  .blur:nth-of-type(2){width:78%;}
  .blur::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:none;}
  @keyframes shim{from{transform:translateX(-100%);}to{transform:translateX(100%);}}
  .disc{font-size:12.5px;color:var(--label3);text-align:center;margin-top:18px;padding:0 10px;}

  /* ---------- sim ---------- */
  .yes{padding:calc(env(safe-area-inset-top) + 90px) 24px calc(env(safe-area-inset-bottom) + 30px);display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;}
  .yes .tile{margin:0 auto;}
  .yes h2{font-size:30px;line-height:1.12;font-weight:800;letter-spacing:-0.03em;text-align:center;margin-top:26px;}
  .yes .cta{margin-top:auto;padding-top:30px;}
  .dots{display:flex;gap:7px;justify-content:center;margin-top:18px;}
  .dots i{width:7px;height:7px;border-radius:50%;background:rgba(120,120,128,.25);transition:all .3s;}
  .dots i.on{background:var(--green);width:20px;border-radius:7px;}

  /* ---------- oferta ---------- */
  .offer{padding-bottom:140px;}
  .o-hero{
    padding:calc(env(safe-area-inset-top) + 30px) 22px 34px;text-align:center;
    background:radial-gradient(120% 70% at 50% -10%, #CDEFD9 0%, rgba(205,239,217,0) 65%), var(--bg);
  }
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);padding:7px 13px;border-radius:100px;font-size:13px;font-weight:600;color:var(--green-d);box-shadow:0 4px 14px -8px rgba(0,0,0,.3);}
  .chip svg.i{width:15px;height:15px;stroke-width:2.6;}
  .o-hero h1{font-size:34px;line-height:1.06;font-weight:800;letter-spacing:-0.035em;margin-top:16px;}
  .o-hero h1 span{background:linear-gradient(90deg,#1E9A55,#30B0C7);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .o-hero .sub{font-size:17px;color:var(--label2);margin-top:12px;}
  .cover-wrap{margin:14px auto 0;position:relative;width:200px;height:262px;}
  .cover{
    position:absolute;inset:0;border-radius:18px;overflow:hidden;
    background:linear-gradient(155deg,#2F6B50 0%,#17382B 100%);color:#fff;text-align:left;
    box-shadow:0 40px 60px -26px rgba(23,56,43,.75), 0 0 0 1px rgba(255,255,255,.08) inset;
    transform:perspective(900px) rotateY(-12deg) rotateX(3deg);
    animation:float 7s ease-in-out infinite;
    padding:22px 20px;display:flex;flex-direction:column;
  }
  .cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:linear-gradient(90deg,rgba(0,0,0,.28),transparent);}
  .cover::after{content:"";position:absolute;right:-50px;bottom:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(120,230,170,.38),transparent 68%);}
  .cover .d{font-size:11px;font-weight:700;letter-spacing:.14em;color:#9FE8BC;}
  .cover b{font-size:27px;line-height:1.02;font-weight:800;letter-spacing:-0.03em;margin-top:10px;}
  .cover i{font-style:normal;font-size:11.5px;color:#BFE9CF;margin-top:auto;line-height:1.35;position:relative;z-index:2;}
  .cover svg{position:absolute;right:14px;top:16px;width:34px;height:34px;color:#9FE8BC;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;z-index:2;}
  .mini-row{display:flex;justify-content:center;gap:12px;margin-top:26px;}
  .mini{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--label2);}
  .mini .tile{width:50px;height:50px;border-radius:14px;}
  .o-cta-top{margin-top:26px;}
  .block{padding:0 20px;margin-top:34px;}
  .block h2{font-size:26px;line-height:1.12;font-weight:800;letter-spacing:-0.03em;}
  .block .lead{font-size:16px;color:var(--label2);margin-top:8px;}
  .pillars{display:flex;flex-direction:column;gap:12px;margin-top:18px;}
  .pillar{background:var(--card);border-radius:22px;padding:18px;display:flex;gap:14px;}
  .pillar b{font-size:17px;font-weight:700;letter-spacing:-0.02em;display:block;}
  .pillar p{font-size:14.5px;color:var(--label2);margin-top:3px;}
  .tl{margin-top:18px;background:var(--card);border-radius:22px;padding:8px 18px;}
  .tl-i{display:flex;gap:14px;padding:16px 0;position:relative;}
  .tl-i + .tl-i{border-top:1px solid var(--sep);}
  .tl-n{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;}
  .tl-i b{font-size:16.5px;font-weight:700;letter-spacing:-0.02em;display:block;}
  .tl-i .day{font-size:12.5px;font-weight:700;color:var(--green-d);text-transform:uppercase;letter-spacing:.05em;}
  .tl-i p{font-size:14.5px;color:var(--label2);margin-top:3px;}
  .inc{margin-top:18px;}
  .inc .row{padding:14px 16px;}
  .inc .row::before{left:16px !important;}
  .inc .ok{width:26px;height:26px;border-radius:50%;background:var(--green-soft);color:var(--green-d);display:flex;align-items:center;justify-content:center;flex:none;}
  .inc .ok svg.i{width:14px;height:14px;stroke-width:3.2;}
  .inc .row{font-size:15.5px;font-weight:500;letter-spacing:-0.02em;}
  .bonus{background:var(--card);border-radius:24px;padding:18px;margin-top:12px;position:relative;overflow:hidden;}
  .bonus .top{display:flex;gap:14px;align-items:center;}
  .bonus .tag{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);}
  .bonus b{display:block;font-size:17.5px;font-weight:700;letter-spacing:-0.025em;line-height:1.2;margin-top:2px;}
  .bn-img{display:block;width:100%;height:auto;border-radius:16px;margin:0;}
  .bn-val{margin-top:12px;padding-top:12px;border-top:1px solid var(--sep);font-size:14px;color:var(--label2);display:flex;gap:6px;align-items:baseline;justify-content:center;}

function vslSound(){ trk.add('vsl_sound',97);
  const v=document.getElementById('vslVid'), b=document.getElementById('vslSnd'); if(!v) return;
  v.loop=false; v.muted=false; v.currentTime=0; v.controls=false;
  const pr=v.play(); if(pr&&pr.catch) pr.catch(()=>{ v.muted=true; v.play(); });
  if(b) b.remove();
  v.addEventListener('contextmenu',e=>e.preventDefault());
}
function runVsl(){
  const vv=document.getElementById('vslVid'); if(vv){ const t=vv.play(); if(t&&t.catch) t.catch(()=>{}); }
  if(VSL.embed){
    const box=document.getElementById('vslBox'); box.innerHTML=VSL.embed;
    box.querySelectorAll('script').forEach(o=>{ const n=document.createElement('script'); [...o.attributes].forEach(a=>n.setAttribute(a.name,a.value)); n.text=o.text; o.replaceWith(n); });
  }
  after((VSL.embed||VSL.src?VSL.delay:3)*1000,()=>{ const b=document.getElementById('vslBtn'); if(b) b.style.display='block'; });
}

/* =========================================================
   RENDER / NAVEGAÇÃO
========================================================= */
let timers=[];
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
function after(ms,fn){ timers.push(setTimeout(fn,ms)); }

/* ===== funil: registro por etapa (sem nome, e-mail ou telefone) ===== */
const trk=(function(){
  const sid=Math.random().toString(36).slice(2,10)+Date.now().toString(36);
  const p=new URLSearchParams(location.search);
  const meta={c:p.get('utm_campaign')||'',a:p.get('utm_content')||'',s:p.get('utm_source')||'',d:/Mobi|Android|iPhone/i.test(navigator.userAgent)?'m':'d',t0:Date.now()};
  const test=true||!!p.get('step')||/localhost|127\.0\.0\.1|^$/.test(location.hostname);
  const path=[]; let sent=0;
  function add(k,i){ path.push([i,k,Date.now()-meta.t0]); }
  function flush(){ if(test||path.length===sent) return; sent=path.length;
    try{ const b=JSON.stringify({sid:sid,m:meta,p:path}); if(!(navigator.sendBeacon&&navigator.sendBeacon('/api/t',b))) fetch('/api/t',{method:'POST',body:b,keepalive:true}); }catch(e){} }
  addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') flush(); });
  addEventListener('pagehide',flush);
  return {add:add,flush:flush};
})();
function stepKey(s){ return s.type==='q'?('q_'+s.q.id):(s.type==='img'?('img_'+s.id):s.type); }

function render(){
  clearTimers();
  window.removeEventListener('scroll',onScroll);
  const s = FLOW[state.i];
  trk.add(stepKey(s),state.i); if(s.type==='vsl'||s.type==='offer'||s.type==='result') trk.flush();
  const m = {cover:sCover,q:()=>sQuestion(s.q),img:()=>sImg(s),map:sMap,info:()=>sInfo(s),example:sExample,name:sName,vsl:sVsl,auth:sAuth,commit:sCommit,mech:sMech,incl:sIncl,
    testimonials:sTestimonials,analyzing:sAnalyzing,result:sResult,capture:sCapture,offer:sOffer};
  $app.innerHTML = m[s.type]();
  window.scrollTo(0,0);
  if(s.type==='analyzing') runAnalyzing();
  if(s.type==='result') runResult();
  
  if(s.type==='testimonials') runTm();
  if(s.type==='name'){ const e=document.getElementById('nm'); if(e && !('ontouchstart' in window)) e.focus(); }
  if(DEV_SKIP && s.type!=='offer'){
    const btn=document.createElement('button'); btn.className='dev-skip'; btn.textContent='Ir direto para a oferta (temporário)';
    btn.onclick=()=>{ state.i=FLOW.findIndex(x=>x.type==='offer'); try{compute();}catch(e){} render(); };
    const bar=document.querySelector('.bottom-bar'); if(bar) bar.appendChild(btn); else { btn.classList.add('float'); document.body.appendChild(btn); }
  }
  document.querySelectorAll('.dev-skip.float').forEach(b=>{ if(s.type==='offer') b.remove(); });
  if(s.type==='offer'){ window.addEventListener('scroll',onScroll,{passive:true}); onScroll(); runCountdown(); if(cdExpired()) applyExpired(); }
}

function next(){ if(state.i<FLOW.length-1){ state.i++; render(); } }
function back(){
  let t=state.i-1;
  while(t>0 && FLOW[t].type==='analyzing') t--;
  state.i=Math.max(0,t); render();
}

function pick(id,k,el){
  const q=Object.values(Q).find(x=>x.id===id);
  let cur=state.ans[id]||[];
  if(q.multi){
    const p=cur.indexOf(k); if(p>-1) cur.splice(p,1); else { if(q.options[k].x) cur=[]; else cur=cur.filter(i=>!q.options[i].x); cur.push(k); }
    state.ans[id]=cur; document.querySelectorAll('#opts .opt').forEach((o,i)=>o.classList.toggle('sel',cur.includes(i)));
    const b=document.getElementById('goBtn'); if(b) b.disabled = cur.length===0;
  } else {
    state.ans[id]=[k];
    document.querySelectorAll('#opts .opt').forEach(o=>o.classList.remove('sel'));
    el.classList.add('sel');
    if(q.id==='chan') state.channel = k===0 ? 'whats' : 'email';
    if(navigator.vibrate) try{navigator.vibrate(8);}catch(e){}
    after(320,next);
  }
}
function pickImg(id,k,el){
  state.ans[id]=[k];
  document.querySelectorAll('#opts .imgcard').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  after(320,next);
}
function zone(k){
  if(k==='all') state.zones = state.zones.length===4 ? [] : ZONES.map(z=>z.k);
  else { const p=state.zones.indexOf(k); if(p>-1) state.zones.splice(p,1); else state.zones.push(k); }
  render();
}

function submitName(){
  const v=document.getElementById('nm').value.trim();
  const bad = v.length<2;
  document.getElementById('fName').classList.toggle('err',bad);
  if(bad){ document.getElementById('nm').focus(); return; }
  state.name=v; next();
}
function submitContact(){
  const v=document.getElementById('ct').value.trim();
  const ok = state.channel==='whats' ? v.replace(/\D/g,'').length>=10 : /^\S+@\S+\.\S+$/.test(v);
  document.getElementById('fContact').classList.toggle('err',!ok);
  if(!ok){ document.getElementById('ct').focus(); return; }
  state.contact=v;
  if(WEBHOOK_URL){
    try{ fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},keepalive:true,
      body:JSON.stringify({name:state.name,channel:state.channel,contact:v,score:state.pct,level:level(state.pct).k,
        goal:goalText(),cats:state.cats,zones:pickedList('sint').map(o=>o.t),answers:state.ans,qs:location.search})}); }catch(e){}
  }
  next();
}

function runAnalyzing(){
  compute();
  const dur = ANA.length*850+700, t0=performance.now(), el=document.getElementById('anaPct');
  (function tick(t){ if(!el||!el.isConnected) return;
    const p=Math.min(1,(t-t0)/dur); el.textContent=Math.round(98*p)+'%'; if(p<1) requestAnimationFrame(tick); })(t0);
  ANA.forEach((_,k)=>{
    after(250+k*850,()=>{ const e=document.getElementById('ck'+k); if(e) e.classList.add('on'); });
    after(250+k*850+650,()=>{ const e=document.getElementById('ck'+k); if(e) e.classList.add('done'); });
  });
  after(dur+500,()=>next());
}

function runResult(){
  const R=78, C=2*Math.PI*R;
  after(250,()=>{
    const fg=document.getElementById('ringFg'); if(fg) fg.style.strokeDashoffset = C*(1-state.pct/100);
    document.querySelectorAll('.bar i').forEach(b=>b.style.width=b.dataset.w+'%');
    const t0=performance.now(), dur=1500, el=document.getElementById('numTxt');
    (function tick(t){ if(!el||!el.isConnected) return;
      const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      el.textContent=Math.round(state.pct*e); if(p<1) requestAnimationFrame(tick); })(t0);
  });
}

function runTm(){
  let i=0;
  (function loop(){ after(3000,()=>{
    const c=document.querySelector('.tm-sl'); if(!c) return;
    const cards=c.querySelectorAll('.tm-card'); if(cards.length<2) return;
    i=(i+1)%cards.length; const el=cards[i];
    c.scrollTo({left:el.offsetLeft-(c.clientWidth-el.offsetWidth)/2,behavior:'smooth'}); loop(); }); })();
}
function onScroll(){
  const st=document.getElementById('sticky'); if(!st) return;
  const price=document.getElementById('oferta');
  const pr=price?price.getBoundingClientRect():null;
  const nearPrice = pr && pr.top<window.innerHeight*0.85 && pr.bottom>0;
  st.classList.toggle('show', window.scrollY>520 && !nearPrice);
}
let CD_END=0;
function cdExpired(){ return CD_END>0 && Date.now()>=CD_END; }
function runCountdown(){
  const KEY='sibo_cd_end'; let end=0;
  try{ end=+localStorage.getItem(KEY)||0; }catch(e){}
  if(!end||end<Date.now()-86400000){ end=Date.now()+COUNTDOWN.minutes*60000; try{localStorage.setItem(KEY,end);}catch(e){} }
  CD_END=end;
  (function tick(){
    const els=document.querySelectorAll('.cdT'); if(!els.length) return;
    const ms=Math.max(0,CD_END-Date.now()), m=Math.floor(ms/60000), sc=Math.floor(ms%60000/1000);
    els.forEach(e=>e.textContent=String(m).padStart(2,'0')+':'+String(sc).padStart(2,'0'));
    if(ms>0) after(1000,tick); else applyExpired();
  })();
}
function applyExpired(){
  const cd=document.getElementById('cd'); if(cd) cd.innerHTML='<span>A condição especial do seu plano terminou</span>';
  const n=document.getElementById('cdNote'); if(n) n.innerHTML='A condição de quem fez a análise terminou. O valor promocional voltou ao valor original.';
  const pf=document.querySelector('.pc.best .pc-pr'); if(pf) pf.innerHTML='<s>R$</s>'+COUNTDOWN.expired.full;
  const pb=document.querySelector('.pc:not(.best) .pc-pr'); if(pb) pb.innerHTML='<s>R$</s>'+COUNTDOWN.expired.basic;
}
function goPrice(){ trk.add('cta_price',98); const e=document.getElementById('oferta'); if(e) e.scrollIntoView({behavior:'smooth',block:'start'}); }
function toggleFq(k){ document.getElementById('fq'+k).classList.toggle('open'); }

function buy(plan){
  trk.add('buy_'+plan,99); trk.flush();
  const base = plan==='basic'?(cdExpired()&&CHECKOUT_URL_BASIC_EXPIRED!=='#'?CHECKOUT_URL_BASIC_EXPIRED:CHECKOUT_URL_BASIC):(cdExpired()&&CHECKOUT_URL_FULL_EXPIRED!=='#'?CHECKOUT_URL_FULL_EXPIRED:CHECKOUT_URL);
  if(base==='#'){ console.warn('Defina CHECKOUT_URL e CHECKOUT_URL_BASIC no topo do script.'); return; }
  const q=location.search.replace(/^\?/,'');
  const url=base+(q?(base.includes('?')?'&':'?')+q:'');
  window.location.href=url;
}

/* atalho para testes: ?step=NOME pula direto (ex.: ?step=offer) */
(function(){
  const p=new URLSearchParams(location.search).get('step');
  if(p){ const i=FLOW.findIndex(s=>s.type===p); if(i>-1){ state.name='Ana'; state.ans={obj:[0],sint:[0,1,2,6],trig:[0,2,3],tempo:[3],tried:[0,1]}; compute(); state.i=i; } }
})();
render();
</script>
